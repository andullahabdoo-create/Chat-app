name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install & Build Web
        working-directory: ./client
        run: |
          npm install
          npm run build
      - name: Setup Capacitor & Build APK
        working-directory: ./client
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ChatApp" "com.andullah.chatapp" --web-dir=dist
          cat << 'CAP' > capacitor.config.ts
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.andullah.chatapp',
            appName: 'ChatApp',
            webDir: 'dist',
            server: {
              url: 'http://localhost:4000',
              cleartext: true
            }
          };
          export default config;
          CAP
          npx cap add android
          npx cap sync android
          echo 'configurations.all { resolutionStrategy { force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22" } }' >> android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatApp-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
